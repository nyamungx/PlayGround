<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Press+Start+2P&display=swap');
:root{--ink:#221b38;--cream:#fff5da;--pink:#ff8caa;--gold:#ffcf67;--mint:#9ae9d2;--lav:#a9a0ff;--panel:#282341;--line:#ffffff27}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#17152c;color:var(--cream);font-family:Nunito,system-ui,sans-serif;overflow:hidden}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}#app{height:100%;min-height:520px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 12%,#55436e 0,#292743 43%,#17152c 100%)}.stars{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(#ffe8b1 1px,transparent 1.5px),radial-gradient(#bdcaff 1px,transparent 1.5px);background-size:61px 63px,97px 89px;background-position:13px 10px,34px 43px;animation:twinkle 5s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.22}}#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.topbar{position:absolute;z-index:5;left:0;right:0;top:0;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-family:'Press Start 2P',monospace;font-size:clamp(10px,1.3vw,16px);color:#ffe3a1;text-shadow:3px 3px #8e477b;letter-spacing:-1px}.wallet{display:flex;gap:8px;pointer-events:auto}.wallet-chip{background:#211c36d9;border:1px solid #ffffff24;border-radius:20px;padding:7px 12px;font-weight:900;font-size:13px;box-shadow:0 4px #12101f}.wallet-chip b{color:var(--gold);margin-right:4px}.screens{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}.screen{display:none;pointer-events:auto}.screen.active{display:block}.home-card{text-align:center;width:min(560px,92vw);padding:clamp(22px,5vh,48px) 25px 20px;animation:arrive .65s cubic-bezier(.2,.8,.2,1) both}.logo{font-family:'Press Start 2P',monospace;font-size:clamp(26px,6.3vw,62px);line-height:1.35;color:#fff4cd;text-shadow:4px 5px #ca658b,8px 9px #6e456f;margin:0 auto 13px;letter-spacing:-3px}.subtitle{font-size:clamp(12px,1.8vw,16px);font-weight:900;letter-spacing:4px;text-transform:uppercase;color:#b8d7e9;margin:0 0 25px}.hero-preview{width:88px;height:92px;margin:0 auto 10px;filter:drop-shadow(0 10px 12px #100f2355);animation:bob 1.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes arrive{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}.primary,.secondary,.tiny,.icon-btn{border-radius:14px;font-weight:1000;transition:transform .15s,filter .15s;box-shadow:0 5px #171329}.primary:hover,.secondary:hover,.tiny:hover,.icon-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.primary:active,.secondary:active,.tiny:active,.icon-btn:active{transform:translateY(2px);box-shadow:0 2px #171329}.primary{background:linear-gradient(#ffad94,#f5769d);padding:14px 36px;color:#351e3b;font-size:17px;letter-spacing:1px}.secondary{background:#4a426a;padding:11px 17px;color:#fff0d6}.tiny{background:#4b4269;padding:7px 11px;font-size:12px}.menu-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:19px}.hint{font-size:12px;color:#b8b2cd;margin-top:18px}.panel{width:min(780px,94vw);max-height:min(78vh,700px);overflow:auto;background:linear-gradient(145deg,#312b4c,#211d38);border:1px solid #ffffff29;border-radius:23px;padding:22px;box-shadow:0 20px 70px #080718aa, inset 0 1px #ffffff16;animation:arrive .3s ease}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panel h2{margin:0;font-size:21px}.close{background:#453c60;border-radius:12px;width:36px;height:36px;font-size:21px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tab{border-radius:10px;padding:8px 12px;background:#3a3455;color:#cec9dd;font-weight:900;font-size:13px}.tab.active{background:#ffe0a2;color:#372743}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{background:#ffffff0b;border:1px solid var(--line);border-radius:15px;padding:12px;min-height:102px;position:relative}.card.selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px #ffcf6755}.card h3{margin:4px 0;font-size:15px}.card p{margin:4px 0;color:#c5bfd7;font-size:12px;line-height:1.4}.card .price{color:var(--gold);font-weight:1000}.card-btn{margin-top:8px;background:#544970;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:1000}.card-btn:disabled{opacity:.5;cursor:default}.char-icon{font-size:26px;float:right}.statline{display:flex;justify-content:space-between;color:#c8bfdc;font-size:13px;margin:9px 0}.meter{height:8px;border-radius:8px;background:#17152b;overflow:hidden;margin:6px 0}.meter i{height:100%;display:block;background:linear-gradient(90deg,#ff96a8,#ffe080);border-radius:8px}.hud{display:none;position:absolute;z-index:4;inset:0;pointer-events:none}.hud.active{display:block}.hud-top{position:absolute;top:68px;left:20px;right:20px;display:flex;align-items:flex-start;justify-content:space-between}.hud-box{background:#211c36ce;border:1px solid #ffffff24;border-radius:14px;padding:8px 12px;min-width:88px;box-shadow:0 4px #15122866}.hud-label{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:#c6bdd7}.hud-value{font-size:19px;font-weight:1000;color:#fff0c1}.hud-center{position:absolute;top:72px;left:50%;transform:translateX(-50%);text-align:center;min-width:160px}.progress{height:6px;width:150px;background:#ffffff25;border-radius:6px;margin:5px auto;overflow:hidden}.progress i{height:100%;display:block;background:var(--mint);width:0}.hud-bottom{position:absolute;bottom:15px;left:18px;right:18px;display:flex;align-items:end;justify-content:space-between}.control-hint{font-size:11px;color:#f8eaca99;text-shadow:0 2px 3px #17152c}.game-controls{pointer-events:auto;display:flex;gap:9px;align-items:end}.control{width:58px;height:58px;border-radius:17px;background:#302a49dd;border:1px solid #ffffff32;box-shadow:0 5px #171329;color:#fff2d6;font-weight:1000;font-size:22px;user-select:none;-webkit-user-select:none}.control small{display:block;font-size:8px;letter-spacing:1px}.control.skill{width:68px;height:68px;background:linear-gradient(#ffcf77,#ff8ea8);color:#39223b;font-size:21px}.pause-btn{pointer-events:auto;border-radius:12px;background:#211c36cc;padding:8px 12px;font-size:13px;font-weight:1000}.modal-back{position:absolute;inset:0;z-index:8;background:#100e20a8;display:none;place-items:center;padding:15px}.modal-back.show{display:grid}.modal{width:min(400px,94vw);background:#302a49;border:1px solid #ffffff30;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 65px #080718aa;animation:arrive .25s ease}.modal h2{margin:3px 0 8px;font-size:24px}.modal p{color:#d2cbe0;font-size:14px;line-height:1.5}.modal-actions{display:flex;justify-content:center;gap:9px;margin-top:17px}.badge{display:inline-block;background:#ffcf67;color:#30223d;border-radius:20px;padding:5px 10px;font-weight:1000;font-size:11px}.toast{position:absolute;z-index:9;left:50%;top:19%;transform:translate(-50%,-10px);opacity:0;transition:.2s;background:#fff0c9;color:#392540;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:1000;box-shadow:0 5px #c46a8d}.toast.show{opacity:1;transform:translate(-50%,0)}.boss-alert{position:absolute;z-index:4;top:27%;left:0;right:0;text-align:center;color:#ff8aab;font-family:'Press Start 2P',monospace;font-size:clamp(12px,2vw,20px);text-shadow:3px 3px #522943;opacity:0;transition:.3s;pointer-events:none}.boss-alert.show{opacity:1;animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.04)}}.footer{position:absolute;z-index:2;bottom:10px;left:0;right:0;text-align:center;color:#ffffff58;font-size:10px;letter-spacing:1px;pointer-events:none}.mobile-tip{display:none}@media(max-width:650px){.topbar{padding:12px}.wallet-chip{padding:6px 9px;font-size:11px}.brand{font-size:10px}.hud-top{top:60px;left:10px;right:10px}.hud-box{min-width:72px;padding:6px 9px}.hud-value{font-size:16px}.hud-center{top:61px}.hud-bottom{left:10px;right:10px;bottom:12px}.control-hint{display:none}.control{width:52px;height:56px}.control.skill{width:60px;height:62px}.panel{padding:16px;max-height:82vh}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.home-card{padding-top:45px}.footer{display:none}}@media(pointer:coarse){.mobile-tip{display:inline}}
</style>

<body><main id="app"><div class="stars"></div><canvas id="game" aria-label="Sugar Sprint game canvas"></canvas>
<div class="topbar"><div class="brand">✦ SUGAR SPRINT</div><div class="wallet"><div class="wallet-chip"><b>●</b><span id="walletCoins">0</span></div><div class="wallet-chip"><b>◆</b><span id="walletGems">0</span></div></div></div>
<div class="screens"><section class="screen active" id="home"><div class="home-card"><div class="hero-preview" id="heroPreview"></div><h1 class="logo">SUGAR<br>SPRINT</h1><p class="subtitle">The Cloudcrumb Run</p><button class="primary" id="playBtn">▶ &nbsp; START RUN</button><div class="menu-actions"><button class="secondary" data-panel="heroes">🍪 Runners</button><button class="secondary" data-panel="worlds">🌈 Worlds</button><button class="secondary" data-panel="shop">✨ Workshop</button><button class="secondary" data-panel="records">🏆 Journal</button></div><div class="hint">SPACE / ↑ to jump · ↓ to slide · X to dash<br><span class="mobile-tip">Touch controls ready!</span></div></div></section><section class="screen" id="panelScreen"><div class="panel"><div class="panel-head"><h2 id="panelTitle">Runners</h2><button class="close" id="panelClose" aria-label="Close">×</button></div><div class="tabs" id="tabs"></div><div id="panelContent"></div></div></section></div>
<div class="hud" id="hud"><div class="hud-top"><div class="hud-box"><div class="hud-label">Score</div><div class="hud-value" id="score">00000</div></div><div class="hud-center"><div class="hud-label" id="hudWorld">Cloudberry Grove</div><div class="progress"><i id="progress"></i></div></div><div class="hud-box" style="text-align:right"><div class="hud-label">Run coins</div><div class="hud-value">● <span id="runCoins">0</span></div><div class="hud-label" id="lives">♥ ♥ ♥</div></div></div><div class="hud-bottom"><div><button class="pause-btn" id="pauseBtn">Ⅱ PAUSE</button><div class="control-hint">SPACE / ↑ jump · ↓ slide · X dash</div></div><div class="game-controls"><button class="control" id="slideBtn">↓<small>SLIDE</small></button><button class="control" id="jumpBtn">↑<small>JUMP</small></button><button class="control skill" id="skillBtn">✦<small>SKILL</small></button></div></div></div>
<div class="boss-alert" id="bossAlert">THE CRUMBLE KING IS CLOSE!</div><div class="toast" id="toast"></div><div class="footer">A LITTLE SUGAR, A LOT OF SPEED</div><div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const heroes=[
 {name:'Strawberry Sprinter',emoji:'🍓',color:'#ff718d',accent:'#ffe2a6',skill:'Berry Burst',desc:'A fearless dash that clears nearby hazards.'},
 {name:'Moon Mochi',emoji:'🌙',color:'#b8a8ff',accent:'#f2e7ff',skill:'Moon Magnet',desc:'Pulls every nearby coin into your orbit.'},
 {name:'Matcha Mallow',emoji:'🍵',color:'#8ed8ac',accent:'#fff0af',skill:'Green Lightning',desc:'A speedy rush with a protective glow.'},
 {name:'Gloomy Cocoa',emoji:'🍫',color:'#a77978',accent:'#eacbff',skill:'Shadow Veil',desc:'Slip through trouble, unseen and safe.'},
 {name:'Vanilla Cloud',emoji:'☁️',color:'#f4dcae',accent:'#fff9e9',skill:'Sugar Shield',desc:'Restore a heart and block the next hit.'},
 {name:'Soda Pop',emoji:'🫧',color:'#72cce9',accent:'#e9ffff',skill:'Bubble Blast',desc:'Blast away obstacles and score a bonus.'}
];
const worlds=[
 {name:'Cloudberry Grove',sky:'#8876aa',ground:'#b47783',accent:'#ffd58c',obstacle:'mushroom',emoji:'🌸'},
 {name:'Peppermint Peaks',sky:'#668ea3',ground:'#b1d5d2',accent:'#a8f3ed',obstacle:'icicle',emoji:'❄️'},
 {name:'Caramel Canyon',sky:'#d68b69',ground:'#bb7659',accent:'#ffd078',obstacle:'rock',emoji:'🌵'},
 {name:'Moonlit Bakery',sky:'#353654',ground:'#554766',accent:'#b5a4ff',obstacle:'drone',emoji:'🌙'},
 {name:'Ember Sugarlands',sky:'#a85f62',ground:'#6c394d',accent:'#ffc276',obstacle:'flame',emoji:'🔥'}
];
const defaults={coins:80,gems:8,selected:0,world:0,unlockedHeroes:[0],unlockedWorlds:[0],upgrades:{boost:0,magnet:0,heart:0},skins:[],high:0,runs:0,totalCoins:0,missions:{runs:0,coins:0,distance:0},achievements:[]};
let save;try{save=Object.assign({},defaults,JSON.parse(localStorage.getItem('sugarSprintSave')||'{}'));save.upgrades=Object.assign({},defaults.upgrades,save.upgrades);save.missions=Object.assign({},defaults.missions,save.missions)}catch{save={...defaults,upgrades:{...defaults.upgrades},missions:{...defaults.missions}}}
const canvas=$('#game'),ctx=canvas.getContext('2d');let W=960,H=540,ground=425,scale=1,hero=0,world=0,state='menu',run=null,last=0,spawnTimer=50,sceneTime=0,panelTab='';
function fit(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));scale=Math.min(canvas.width/W,canvas.height/H);ctx.setTransform(scale,0,0,scale,Math.round((canvas.width-W*scale)/2),Math.round((canvas.height-H*scale)/2))}addEventListener('resize',fit);fit();
function persist(){localStorage.setItem('sugarSprintSave',JSON.stringify(save));updateWallet()}
function updateWallet(){$('#walletCoins').textContent=save.coins;$('#walletGems').textContent=save.gems}
function rand(a,b){return a+Math.random()*(b-a)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1700)}
function pixelHero(g,x,y,size,index,pose='run',phase=0){const h=heroes[index],s=size/32;g.save();g.translate(Math.round(x),Math.round(y));g.scale(s,s);if(pose==='slide')g.translate(5,8);const bob=pose==='run'?Math.sin(phase)*1.5:0;g.translate(0,bob);g.fillStyle='#37243d';g.fillRect(-10,6,20,7);g.fillStyle=h.color;g.fillRect(-10,-13,20,19);g.fillRect(-7,-19,14,9);g.fillStyle=h.accent;g.fillRect(-6,-9,12,8);g.fillStyle='#2d203c';g.fillRect(-4,-7,3,4);g.fillRect(4,-7,3,4);g.fillStyle='#fff';g.fillRect(-3,-7,1,1);g.fillRect(5,-7,1,1);g.fillStyle=h.color;g.fillRect(-13,-12,4,10);g.fillRect(9,-12,4,10);g.fillStyle=h.accent;g.fillRect(-9,6,8,4);g.fillRect(3,6,8,4);if(index===0){g.fillStyle='#47b779';g.fillRect(-2,-24,4,5);g.fillRect(1,-23,4,2)}if(index===1){g.fillStyle='#fff4c4';g.fillRect(5,-20,4,4)}if(index===2){g.fillStyle='#4b9e6d';g.fillRect(-3,-24,7,5)}if(index===3){g.fillStyle='#483044';g.fillRect(-10,-18,20,4)}if(index===4){g.fillStyle='#fff7e6';g.fillRect(-11,-17,22,4)}if(index===5){g.fillStyle='#b8f5ff';g.fillRect(-4,-23,8,4)}g.restore()}
function backdrop(time,menu=false){const w=worlds[world];let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,w.sky);sky.addColorStop(.72,menu?'#625477':w.sky);sky.addColorStop(1,w.ground);ctx.fillStyle=sky;ctx.fillRect(-8,-8,W+16,H+16);for(let i=0;i<55;i++){let x=(i*173+sceneTime*.17)%W,y=(i*79)%285;ctx.fillStyle=i%3?'#fff5d080':'#d7eaff8a';ctx.fillRect(x,y,2,2)}ctx.fillStyle='#ffffff18';for(let i=0;i<4;i++){let x=((i*270-sceneTime*.18)%(W+200)+W+200)%(W+200)-70;ctx.beginPath();ctx.ellipse(x,90+i%2*52,46,12,0,0,Math.PI*2);ctx.ellipse(x+25,84+i%2*52,31,15,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#4b456777';for(let i=0;i<8;i++){let x=((i*150-sceneTime*.28)%(W+180)+W+180)%(W+180)-90;ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+65,ground-100-(i%3)*24);ctx.lineTo(x+144,ground);ctx.fill()}ctx.fillStyle=w.ground;ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle=w.accent;ctx.fillRect(0,ground,W,4);ctx.fillStyle='#211b3c';ctx.fillRect(0,ground+5,W,H-ground-5);let off=sceneTime%48;for(let x=-48-off;x<W;x+=48){ctx.fillStyle='#ffffff17';ctx.fillRect(x,ground+18,24,3);ctx.fillRect(x+14,ground+31,8,2)}for(let i=0;i<9;i++){let x=((i*141-sceneTime*.65)%(W+50)+W+50)%(W+50)-20;ctx.fillStyle=i%2?'#f2b88a':'#ffe6b0';ctx.fillRect(x,ground-4-(i%3)*4,5,4)}}
function drawMenu(){sceneTime+=.25;backdrop(sceneTime,true);pixelHero(ctx,480,358,88,save.selected,'run',sceneTime*.05);ctx.fillStyle='#fff0c966';ctx.beginPath();ctx.ellipse(480,ground+8,55,7,0,0,7);ctx.fill()}
function showPanel(which,tab){state='panel';$('#home').classList.remove('active');$('#panelScreen').classList.add('active');$('#hud').classList.remove('active');panelTab=tab||which;renderPanel(which)}
function closePanel(){state='menu';$('#panelScreen').classList.remove('active');$('#home').classList.add('active')}
function renderPanel(which){const titles={heroes:'Choose Your Runner',worlds:'Pick a Sweet World',shop:'The Sugar Workshop',records:'Adventurer Journal'};$('#panelTitle').textContent=titles[which]||'Journal';let tabs=which==='shop'?['upgrades','skins']:which==='records'?['missions','achievements','high scores']:[];$('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${panelTab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');$('#tabs').style.display=tabs.length?'flex':'none';let content='';
 if(which==='heroes'){content='<div class="grid">'+heroes.map((h,i)=>{let unlocked=save.unlockedHeroes.includes(i),selected=save.selected===i;return `<article class="card ${selected?'selected':''}"><span class="char-icon">${h.emoji}</span><h3>${h.name}</h3><p>${h.desc}</p><p><b style="color:var(--mint)">${h.skill}</b></p><button class="card-btn" data-hero="${i}" ${!unlocked?'':' '}>${selected?'Selected':unlocked?'Select':'Unlock · '+(i*75)+' ●'}</button></article>`}).join('')+'</div>'}
 if(which==='worlds'){content='<div class="grid">'+worlds.map((w,i)=>{let unlocked=save.unlockedWorlds.includes(i);return `<article class="card ${save.world===i?'selected':''}" style="background:linear-gradient(145deg,${w.sky}55,#ffffff08)"><span class="char-icon">${w.emoji}</span><h3>${w.name}</h3><p>${['A breezy first dash through the blossom trees.','Watch for slippery ice and falling icicles.','Warm winds hide chunky rolling rocks.','A midnight maze with buzzing pastry drones.','The final fiery sprint. Mind the flames!'][i]}</p><button class="card-btn" data-world="${i}">${save.world===i?'Selected':unlocked?'Travel here':'Unlock · '+(i*50)+' ●'}</button></article>`}).join('')+'</div>'}
 if(which==='shop'&&panelTab==='upgrades'){const names={boost:['Pep in Your Step','Start each run a little faster.'],magnet:['Crumb Magnet','Coins drift toward you from farther away.'],heart:['Extra Heart','Begin each run with an extra life.']};content='<div class="grid">'+Object.keys(names).map(k=>{let level=save.upgrades[k],cost=(level+1)*70;return `<article class="card"><span class="char-icon">${k==='boost'?'⚡':k==='magnet'?'🧲':'💗'}</span><h3>${names[k][0]}</h3><p>${names[k][1]}</p><div class="meter"><i style="width:${level*20}%"></i></div><p>Level ${level}/5</p><button class="card-btn" data-upgrade="${k}" ${level>=5?'disabled':''}>${level>=5?'MAXED':'Upgrade · '+cost+' ●'}</button></article>`}).join('')+'</div>'}
 if(which==='shop'&&panelTab==='skins'){content='<p style="color:#c5bfd7">A little extra sparkle for your favorite runner. Choose a palette to collect.</p><div class="grid">'+['Berry Pop','Starlight','Mint Chip','Golden Hour'].map((n,i)=>{let got=save.skins.includes(i);return `<article class="card"><span class="char-icon">${['🍓','🌟','🍃','✨'][i]}</span><h3>${n}</h3><p>Rare colorway for every runner.</p><button class="card-btn" data-skin="${i}">${got?'Owned':'Collect · '+(i+1)*5+' ◆'}</button></article>`}).join('')+'</div>'}
 if(which==='records'&&panelTab==='missions'){const ms=[['runs','Finish 3 runs',save.missions.runs,3,'🏃'],['coins','Collect 100 coins',save.missions.coins,100,'🪙'],['distance','Run 2,000m',Math.floor(save.missions.distance),2000,'📏']];content='<div class="grid">'+ms.map(([key,label,val,goal,ico])=>{let done=save.achievements.includes('mission-'+key);return `<article class="card"><span class="char-icon">${ico}</span><h3>${label}</h3><div class="meter"><i style="width:${Math.min(100,val/goal*100)}%"></i></div><p>${Math.min(val,goal)} / ${goal} · Reward: 40 ●</p><button class="card-btn" data-mission="${key}" ${val<goal||done?'disabled':''}>${done?'Claimed':val>=goal?'Claim reward':'In progress'}</button></article>`}).join('')+'</div>'}
 if(which==='records'&&panelTab==='achievements'){const ach=[['first','First Crumbs','Collect your first coin.','🪙',save.totalCoins>0],['speedster','Sugar Rush','Complete a run of 500m.','⚡',save.missions.distance>=500],['collector','Pocket Full','Collect 100 lifetime coins.','💰',save.totalCoins>=100],['veteran','Back for Seconds','Play 10 runs.','🎂',save.runs>=10]];content='<div class="grid">'+ach.map(([id,n,d,ic,ok])=>{if(ok&&!save.achievements.includes(id)){save.achievements.push(id);persist()}return `<article class="card"><span class="char-icon">${ic}</span><h3>${n} ${ok?'✓':'🔒'}</h3><p>${d}</p><span class="badge">${ok?'UNLOCKED':'LOCKED'}</span></article>`}).join('')+'</div>'}
 if(which==='records'&&panelTab==='high scores'){content=`<div class="card" style="text-align:center;padding:30px"><div style="font-size:48px">🏆</div><h3>Personal Best</h3><div style="font-size:38px;color:var(--gold);font-weight:1000">${save.high.toLocaleString()}</div><p>${save.runs} runs · ${save.totalCoins.toLocaleString()} lifetime crumbs collected</p></div>`}
 $('#panelContent').innerHTML=content;$('#panelContent').dataset.kind=which;
}
function bindPanel(){const content=$('#panelContent');content.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.hero!==undefined){let i=+b.dataset.hero;if(save.unlockedHeroes.includes(i)){save.selected=i;$('#heroPreview').textContent=heroes[i].emoji;persist();renderPanel('heroes')}else{let cost=i*75;if(save.coins>=cost){save.coins-=cost;save.unlockedHeroes.push(i);save.selected=i;$('#heroPreview').textContent=heroes[i].emoji;persist();toast(`${heroes[i].name} joined the crew!`);renderPanel('heroes')}else toast('Not enough crumbs yet!')}}if(b.dataset.world!==undefined){let i=+b.dataset.world;if(save.unlockedWorlds.includes(i)){save.world=i;persist();renderPanel('worlds')}else{let cost=i*50;if(save.coins>=cost){save.coins-=cost;save.unlockedWorlds.push(i);save.world=i;persist();toast(`${worlds[i].name} unlocked!`);renderPanel('worlds')}else toast('Not enough crumbs yet!')}}if(b.dataset.upgrade){let k=b.dataset.upgrade,cost=(save.upgrades[k]+1)*70;if(save.upgrades[k]<5&&save.coins>=cost){save.coins-=cost;save.upgrades[k]++;persist();renderPanel('shop');toast('Upgrade sweetened!')}else toast('Collect more crumbs to upgrade!')}if(b.dataset.skin!==undefined){let i=+b.dataset.skin,cost=(i+1)*5;if(save.skins.includes(i))toast('That palette is already yours!');else if(save.gems>=cost){save.gems-=cost;save.skins.push(i);persist();renderPanel('shop');toast('New palette collected!')}else toast('Not enough gems!')}if(b.dataset.mission){let k=b.dataset.mission,goal={runs:3,coins:100,distance:2000}[k];if(save.missions[k]>=goal&&!save.achievements.includes('mission-'+k)){save.achievements.push('mission-'+k);save.coins+=40;persist();renderPanel('records');toast('Mission cleared · 40 crumbs!')}}};$('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(!b)return;panelTab=b.dataset.tab;renderPanel($('#panelContent').dataset.kind||'shop')}}bindPanel();
function openModal(html){$('#modal').innerHTML=html;$('#modalBack').classList.add('show')}
function hideModal(){$('#modalBack').classList.remove('show')}
function startRun(){hero=save.selected;world=save.world;run={distance:0,coins:0,gems:0,lives:Math.min(4,3+save.upgrades.heart),speed:3.3+jumpBoost(),height:0,vy:0,jumps:0,slide:0,skill:0,invuln:0,shield:0,combo:0,comboTime:0,objects:[],particles:[],bg:0,score:0,shake:0,boss:0,bossActive:0,dash:0};spawnTimer=44;state='playing';$('#home').classList.remove('active');$('#panelScreen').classList.remove('active');$('#hud').classList.add('active');hideModal();last=performance.now();requestAnimationFrame(frame)}
function jumpBoost(){return save.upgrades.boost*.14}
function jump(){if(state!=='playing'||run.slide>0)return;if(run.jumps<2){run.vy=run.jumps===0?10.4:8.7;run.jumps++;burst(150,ground-run.height-10,run.jumps===1?worlds[world].accent:heroes[hero].accent,run.jumps===1?7:12,2);}}
function slide(){if(state==='playing'){run.slide=42;burst(150,ground-3,'#d7e9e9',5,1.3)}}
function activateSkill(){if(state!=='playing'||run.skill>0)return;run.skill=510;run.invuln=105;run.dash=hero===0||hero===2?34:0;let hazards=run.objects.filter(o=>o.kind==='hazard'&&o.x<330);if(hero===0||hero===2||hero===5){hazards.forEach(o=>o.x=-200);run.score+=hero===5?240:80;run.shake=5}if(hero===1){run.objects.forEach(o=>{if(o.kind==='coin'||o.kind==='gem')o.x=150});}if(hero===3){run.invuln=260}if(hero===4){run.shield=260;run.lives=Math.min(4,run.lives+1)}burst(150,ground-run.height-20,heroes[hero].color,24,4);toast(heroes[hero].skill+'!')}
function burst(x,y,color,n=8,power=2){for(let i=0;i<n;i++)run.particles.push({x,y,vx:rand(-power,power),vy:rand(-power*1.5,power*.3),life:rand(18,38),color,size:Math.random()<.25?3:2})}
function spawn(){let r=Math.random(),kind=r<.48?'coin':r<.51?'gem':r<.55?'power':r<.82?'hazard':'coin';let type=kind==='hazard'?worlds[world].obstacle:kind;let y=kind==='coin'||kind==='gem'?ground-rand(44,118):kind==='power'?ground-65:type==='drone'||type==='icicle'?ground-49:ground-9;run.objects.push({kind,type,x:W+24,y,phase:Math.random()*7,hit:false,power:['shield','magnet','boost'][Math.floor(Math.random()*3)]});if(Math.random()<.25&&kind==='coin'){for(let i=1;i<4;i++)run.objects.push({kind:'coin',type:'coin',x:W+24+i*24,y:y-Math.sin(i/3*Math.PI)*18,phase:0,hit:false})}}
function collect(o){if(o.kind==='coin'||o.kind==='gem'){let n=o.kind==='gem'?1:1;run.coins+=o.kind==='coin'?1:0;run.gems+=o.kind==='gem'?1:0;run.score+=o.kind==='gem'?120:35;run.combo++;run.comboTime=125;burst(o.x,o.y,o.kind==='gem'?'#86f3e7':'#ffd56d',9,2);if(o.kind==='gem')toast('Gem found! +1 ✦');return true}if(o.kind==='power'){run.shield=260;run.invuln=160;if(o.power==='boost')run.dash=38;burst(o.x,o.y,'#a1f2cf',18,3);toast(`${o.power} power-up!`);return true}return false}
function drawObjects(dt,f){for(let i=run.objects.length-1;i>=0;i--){let o=run.objects[i];o.x-=run.speed*f*(run.dash>0?1.7:1);o.phase+=dt*.006;let x=Math.round(o.x),y=Math.round(o.y+Math.sin(o.phase)*2);if(o.kind==='coin'||o.kind==='gem'){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(o.phase)*.18);ctx.fillStyle=o.kind==='gem'?'#86f3e7':'#ffd56d';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.fillRect(-5,-5,10,10);ctx.shadowBlur=0;ctx.fillStyle='#fff7ce';ctx.fillRect(-2,-4,3,3);ctx.restore();let magnet=save.upgrades.magnet>0?16+save.upgrades.magnet*9:0;if(magnet&&x<220&&x>135&&Math.abs(y-(ground-28-run.height))<60)o.x-=2;if(Math.abs(x-150)<18+magnet&&Math.abs(y-(ground-22-run.height))<27){collect(o);run.objects.splice(i,1);continue}}
 else if(o.kind==='power'){ctx.fillStyle='#9ef3ce';ctx.shadowColor='#9ef3ce';ctx.shadowBlur=10;ctx.fillRect(x-8,y-8,16,16);ctx.shadowBlur=0;ctx.fillStyle='#183d42';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('✧',x,y+4);if(Math.abs(x-150)<20&&Math.abs(y-(ground-20-run.height))<30){collect(o);run.objects.splice(i,1);continue}}
 else{drawHazard(o,x,y);let airborne=run.height>26,sliding=run.slide>0;let vertical=o.type==='drone'||o.type==='icicle'?Math.abs(y-(ground-34-run.height))<38:Math.abs(y-(ground-11))<23;let overlaps=Math.abs(x-150)<24&&vertical;if(overlaps&&!airborne&&!sliding&&!run.invuln&&!run.shield&&!o.hit){o.hit=true;run.lives--;run.invuln=100;run.shake=10;burst(150,ground-run.height-18,'#ff778e',14,3);toast(run.lives?'Ouch! Watch your step!':'The Crumble King got you!');if(run.lives<=0){endRun();return}}}if(o.x< -40)run.objects.splice(i,1)}
 for(let i=run.particles.length-1;i>=0;i--){let p=run.particles[i];p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=.12*f;p.life-=f;ctx.globalAlpha=clamp(p.life/24,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);if(p.life<=0)run.particles.splice(i,1)}ctx.globalAlpha=1}
function drawHazard(o,x,y){ctx.save();if(o.type==='drone'){ctx.fillStyle='#e99acb';ctx.fillRect(x-13,y-6,26,12);ctx.fillStyle='#82edf0';ctx.fillRect(x-6,y-3,6,4);ctx.fillRect(x-17,y-11,7,3);ctx.fillRect(x+10,y-11,7,3);ctx.fillStyle='#553e70';ctx.fillRect(x-8,y+6,3,4);ctx.fillRect(x+6,y+6,3,4)}else if(o.type==='icicle'){ctx.fillStyle='#b9f1f0';ctx.fillRect(x-6,y-20,12,20);ctx.fillStyle='#efffff';ctx.fillRect(x-3,y-18,3,11)}else if(o.type==='flame'){ctx.fillStyle='#ff724e';ctx.fillRect(x-9,y-14,18,14);ctx.fillStyle='#ffc45d';ctx.fillRect(x-5,y-9,10,9);ctx.fillStyle='#fff0a0';ctx.fillRect(x-2,y-6,4,6)}else if(o.type==='mushroom'){ctx.fillStyle='#e07472';ctx.fillRect(x-12,y-13,24,8);ctx.fillStyle='#fff0d6';ctx.fillRect(x-7,y-10,4,3);ctx.fillRect(x+3,y-8,4,3);ctx.fillStyle='#ead2a4';ctx.fillRect(x-6,y-5,12,7)}else{ctx.fillStyle=worlds[world].accent;ctx.fillRect(x-10,y-14,20,15);ctx.fillStyle='#765348';ctx.fillRect(x-6,y-9,3,2);ctx.fillRect(x+3,y-7,3,2)}ctx.restore()}
function endRun(){if(state!=='playing')return;state='over';$('#hud').classList.remove('active');let score=Math.floor(run.score+run.coins*25+run.distance*.3);let coinReward=run.coins+Math.floor(run.distance/180);save.coins+=coinReward;save.gems+=run.gems;save.totalCoins+=run.coins;let newBest=score>save.high;save.high=Math.max(save.high,score);save.runs++;save.missions.runs++;save.missions.coins+=run.coins;save.missions.distance+=Math.floor(run.distance);persist();let achievement=newBest?'New personal best!':'Sweet run!';openModal(`<div style="font-size:48px">${run.lives?'🏁':'💥'}</div><h2>${run.lives?'Run complete!':'Run over!'}</h2><p>${achievement}<br><span class="badge">${worlds[world].name}</span></p><div class="statline"><span>Score</span><b>${score.toLocaleString()}</b></div><div class="statline"><span>Distance</span><b>${Math.floor(run.distance)} m</b></div><div class="statline"><span>Crumbs collected</span><b>● ${coinReward}</b></div><div class="statline"><span>Gems found</span><b>◆ ${run.gems}</b></div><div class="modal-actions"><button class="primary" id="againBtn">RUN AGAIN</button><button class="secondary" id="homeBtn">HOME</button></div>`)}
function frame(now){if(state!=='playing'){if(state==='menu'||state==='panel'){drawMenu();requestAnimationFrame(frame)}return}let dt=Math.min(36,now-last),f=dt/16.67;last=now;run.distance+=run.speed*.075*f;run.score+=run.speed*.39*f;run.bg+=run.speed*f;run.speed=Math.min(6.7,3.3+jumpBoost()+run.distance*.0006);if(run.height>0||run.vy>0){run.vy-=.56*f;run.height+=run.vy*f;if(run.height<=0){run.height=0;run.vy=0;run.jumps=0;burst(150,ground-2,worlds[world].accent,4,1)}}if(run.slide>0)run.slide=Math.max(0,run.slide-f);if(run.skill>0)run.skill=Math.max(0,run.skill-f);if(run.invuln>0)run.invuln-=f;if(run.shield>0)run.shield-=f;if(run.dash>0)run.dash-=f;if(run.comboTime>0)run.comboTime-=f;else run.combo=0;run.boss+=f;if(run.boss>1100){run.boss=0;run.bossActive=210;$('#bossAlert').classList.add('show');setTimeout(()=>$('#bossAlert').classList.remove('show'),2300);toast('The Crumble King is gaining on you!')}if(run.bossActive>0){run.bossActive-=f;if(run.bossActive<35&&Math.random()<.035){run.objects.push({kind:'hazard',type:worlds[world].obstacle,x:W+4,y:ground-10,phase:0,hit:false})}}spawnTimer-=f;if(spawnTimer<=0){spawn();spawnTimer=Math.max(33,rand(53,91)-run.distance*.009)}sceneTime=run.bg;if(run.shake>0)run.shake*=.78;ctx.save();if(run.shake>1)ctx.translate(rand(-run.shake,run.shake),rand(-2,2));backdrop(sceneTime);drawObjects(dt,f);if(run.bossActive>0){ctx.globalAlpha=.5+Math.sin(now*.012)*.15;pixelHero(ctx,45,ground-12,80,5,'run',now*.012);ctx.globalAlpha=1}if(run.invuln>0&&Math.floor(now/75)%2===0)ctx.globalAlpha=.45;pixelHero(ctx,150,ground-17-run.height,52,hero,run.slide>0?'slide':'run',now*.012);ctx.globalAlpha=1;if(run.shield>0){ctx.strokeStyle='#a5ffe9aa';ctx.lineWidth=3;ctx.beginPath();ctx.arc(150,ground-20-run.height,34+Math.sin(now*.01)*2,0,Math.PI*2);ctx.stroke()}ctx.restore();$('#score').textContent=String(Math.floor(run.score+run.coins*25)).padStart(5,'0');$('#runCoins').textContent=run.coins;$('#lives').textContent=Array.from({length:4},(_,i)=>i<run.lives?'♥':'♡').join(' ');$('#progress').style.width=(run.distance%1000)/10+'%';$('#hudWorld').textContent=worlds[world].name+' · '+String(Math.floor(run.distance/1000)+1).padStart(2,'0');$('#skillBtn').innerHTML=run.skill>0?`⌛<small>${Math.ceil(run.skill/60)}s</small>`:'✦<small>SKILL</small>';$('#skillBtn').style.opacity=run.skill>0?'.5':'1';requestAnimationFrame(frame)}
function render(){if(state==='menu'||state==='panel')drawMenu();requestAnimationFrame(render)}
function pauseRun(){if(state!=='playing')return;state='paused';openModal(`<div style="font-size:44px">⏸️</div><h2>Take a breather</h2><p>Your crumbs are safe. Ready when you are!</p><div class="modal-actions"><button class="primary" id="resumeBtn">KEEP RUNNING</button><button class="secondary" id="quitBtn">END RUN</button></div>`)}
$('#playBtn').addEventListener('click',startRun);$$('[data-panel]').forEach(b=>b.addEventListener('click',()=>showPanel(b.dataset.panel,b.dataset.panel==='shop'?'upgrades':b.dataset.panel==='records'?'missions':b.dataset.panel)));$('#panelClose').addEventListener('click',closePanel);$('#pauseBtn').addEventListener('click',pauseRun);
$('#jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#slideBtn').addEventListener('pointerdown',e=>{e.preventDefault();slide()});$('#skillBtn').addEventListener('pointerdown',e=>{e.preventDefault();activateSkill()});
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Escape'){if($('#modalBack').classList.contains('show'))hideModal();else if(state==='playing')pauseRun();else if(state==='panel')closePanel();return}if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();if(e.code==='ArrowDown'||e.code==='KeyS')slide();if(e.code==='KeyX'||e.code==='ShiftLeft'||e.code==='KeyZ')activateSkill()});
$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack'&&state==='paused')return});$('#modal').addEventListener('click',e=>{if(e.target.id==='resumeBtn'){hideModal();state='playing';last=performance.now();requestAnimationFrame(frame)}if(e.target.id==='quitBtn'){hideModal();endRun()}if(e.target.id==='againBtn')startRun();if(e.target.id==='homeBtn'){hideModal();state='menu';$('#home').classList.add('active');$('#bossAlert').classList.remove('show');requestAnimationFrame(render)}});
updateWallet();$('#heroPreview').textContent=heroes[save.selected].emoji;$('#heroPreview').style.fontSize='58px';requestAnimationFrame(render);
</script></body></html>
